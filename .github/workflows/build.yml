name: Build and Release

on:
  push:
    tags:
      - 'v*' 
  workflow_dispatch:

jobs:
  build:
    name: Build for all platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            path: build/app/outputs/flutter-apk/app-release.apk
          - os: macos-latest
            platform: ios
            path: build/ios/ipa/*.ipa
          - os: windows-latest
            platform: windows
            path: build/windows/runner/Release/

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install Dependencies
        run: flutter pub get

      - name: Build Platform
        run: |
          if [ "${{ matrix.platform }}" == "android" ]; then flutter build apk --release; fi
          if [ "${{ matrix.platform }}" == "ios" ]; then flutter build ipa --no-codesign; fi
          if [ "${{ matrix.platform }}" == "windows" ]; then flutter build windows --release; fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: ${{ matrix.path }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-build/*.apk
            ios-build/*.ipa
            windows-build/**
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}